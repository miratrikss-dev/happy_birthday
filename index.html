<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>С днём рождения, красавчик! 🎂</title>
  <meta name="description" content="Праздничный тест: насколько хорошо ты знаешь свою любимую жену?">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <section class="quiz-card" aria-labelledby="title">
      <div class="sparkles" aria-hidden="true">✨ 💚 🎉 ✨</div>
      <h1 id="title">Проверь, насколько хорошо<br>ты знаешь свою жену! 💚</h1>
      <p class="subtitle">Ответь на вопросы и узнай, заслуживаешь ли ты подарок 😉</p>

      <form id="quiz">
        <fieldset>
          <legend>1. Какой любимый цвет жены?</legend>
          <label><input type="radio" name="q1" value="a"> <span>а.</span> зеленый</label>
          <label><input type="radio" name="q1" value="b"> <span>б.</span> голубой</label>
          <label><input type="radio" name="q1" value="c"> <span>в.</span> фиолетовый</label>
        </fieldset>

        <fieldset>
          <legend>2. Какой самый любимый напиток жены?</legend>
          <label><input type="radio" name="q2" value="a"> <span>а.</span> зеленый чай</label>
          <label><input type="radio" name="q2" value="b"> <span>б.</span> кофе</label>
          <label><input type="radio" name="q2" value="c"> <span>в.</span> мио мио</label>
        </fieldset>

        <fieldset>
          <legend>3. Чем твоя жена никогда не занималась?</legend>
          <label><input type="radio" name="q3" value="a"> <span>а.</span> реконструкцией</label>
          <label><input type="radio" name="q3" value="b"> <span>б.</span> вязанием</label>
          <label><input type="radio" name="q3" value="c"> <span>в.</span> пением</label>
        </fieldset>

        <fieldset>
          <legend>4. Любимый школьный предмет жены?</legend>
          <label><input type="radio" name="q4" value="a"> <span>а.</span> физкультура</label>
          <label><input type="radio" name="q4" value="b"> <span>б.</span> биология</label>
          <label><input type="radio" name="q4" value="c"> <span>в.</span> история</label>
        </fieldset>

        <button type="submit">Проверить 💚</button>
      </form>

      <div id="result" class="result" role="status" aria-live="polite" hidden></div>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
